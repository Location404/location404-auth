<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#51B059" text-anchor="middle">
    Clean Architecture - Location404 Auth Service
  </text>

  <!-- Legend -->
  <g id="legend">
    <rect x="600" y="50" width="15" height="15" fill="#3B96E6"/>
    <text x="620" y="62" font-family="Arial, sans-serif" font-size="11" fill="white">API Layer</text>

    <rect x="600" y="70" width="15" height="15" fill="#51B059"/>
    <text x="620" y="82" font-family="Arial, sans-serif" font-size="11" fill="white">Application</text>

    <rect x="600" y="90" width="15" height="15" fill="#FFB84D"/>
    <text x="620" y="102" font-family="Arial, sans-serif" font-size="11" fill="white">Domain</text>

    <rect x="600" y="110" width="15" height="15" fill="#DC382D"/>
    <text x="620" y="122" font-family="Arial, sans-serif" font-size="11" fill="white">Infrastructure</text>
  </g>

  <!-- API Layer (Outer) -->
  <g id="api-layer">
    <rect x="50" y="70" width="520" height="120" rx="8" fill="#3B96E6" opacity="0.15" stroke="#3B96E6" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="310" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3B96E6" text-anchor="middle">API Layer (Minimal APIs)</text>

    <!-- AuthEndpoints -->
    <rect x="70" y="110" width="140" height="60" rx="6" fill="#3B96E6" opacity="0.9"/>
    <text x="140" y="128" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Auth Endpoints</text>
    <text x="140" y="144" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">Login, Refresh</text>
    <text x="140" y="158" font-family="Arial, sans-serif" font-size="9" fill="#cccccc" text-anchor="middle">JWT Cookie Management</text>

    <!-- UserEndpoints -->
    <rect x="230" y="110" width="140" height="60" rx="6" fill="#3B96E6" opacity="0.9"/>
    <text x="300" y="128" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">User Endpoints</text>
    <text x="300" y="144" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">CRUD, Profile</text>
    <text x="300" y="158" font-family="Arial, sans-serif" font-size="9" fill="#cccccc" text-anchor="middle">Image Upload</text>

    <!-- Filters -->
    <rect x="390" y="110" width="160" height="60" rx="6" fill="#3B96E6" opacity="0.9"/>
    <text x="470" y="128" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Filters & Middleware</text>
    <text x="470" y="144" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">Validation (FluentVal)</text>
    <text x="470" y="158" font-family="Arial, sans-serif" font-size="9" fill="#cccccc" text-anchor="middle">Auth, CORS, Exception</text>
  </g>

  <!-- Arrow from API to Application -->
  <path d="M 310 190 L 310 220" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Application Layer -->
  <g id="application-layer">
    <rect x="50" y="220" width="520" height="120" rx="8" fill="#51B059" opacity="0.15" stroke="#51B059" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="310" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#51B059" text-anchor="middle">Application Layer (CQRS)</text>

    <!-- Commands -->
    <rect x="70" y="260" width="150" height="60" rx="6" fill="#51B059" opacity="0.9"/>
    <text x="145" y="275" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Commands</text>
    <text x="145" y="289" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">CreateUser</text>
    <text x="145" y="301" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">AuthenticateUser</text>
    <text x="145" y="313" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">RefreshToken</text>

    <!-- Interfaces -->
    <rect x="240" y="260" width="160" height="60" rx="6" fill="#51B059" opacity="0.9"/>
    <text x="320" y="275" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Interfaces</text>
    <text x="320" y="289" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">IUserRepository</text>
    <text x="320" y="301" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">IPasswordHasher</text>
    <text x="320" y="313" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">ITokenGenerator</text>

    <!-- Validators -->
    <rect x="420" y="260" width="130" height="60" rx="6" fill="#51B059" opacity="0.9"/>
    <text x="485" y="278" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Validators</text>
    <text x="485" y="293" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">FluentValidation</text>
    <text x="485" y="306" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">Rules & Checks</text>
  </g>

  <!-- Arrow from Application to Domain -->
  <path d="M 310 340 L 310 370" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Domain Layer (Core) -->
  <g id="domain-layer">
    <rect x="150" y="370" width="320" height="90" rx="8" fill="#FFB84D" opacity="0.15" stroke="#FFB84D" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="310" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFB84D" text-anchor="middle">Domain Layer (Business Logic)</text>

    <!-- Entities -->
    <rect x="170" y="410" width="100" height="40" rx="6" fill="#FFB84D" opacity="0.9"/>
    <text x="220" y="426" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Entities</text>
    <text x="220" y="441" font-family="Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">User, RefreshToken</text>

    <!-- Value Objects -->
    <rect x="290" y="410" width="110" height="40" rx="6" fill="#FFB84D" opacity="0.9"/>
    <text x="345" y="426" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Value Objects</text>
    <text x="345" y="441" font-family="Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">Email, Password</text>

    <!-- Domain Events -->
    <rect x="420" y="410" width="120" height="40" rx="6" fill="#FFB84D" opacity="0.9"/>
    <text x="480" y="426" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Domain Events</text>
    <text x="480" y="441" font-family="Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">UserCreated</text>
  </g>

  <!-- Arrow from Domain to Infrastructure (dependency inversion) -->
  <path d="M 150 430 L 100 480" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="3,3"/>
  <path d="M 470 430 L 520 480" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="3,3"/>

  <!-- Infrastructure Layer (External) -->
  <g id="infrastructure-layer">
    <rect x="50" y="480" width="520" height="90" rx="8" fill="#DC382D" opacity="0.15" stroke="#DC382D" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="310" y="505" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#DC382D" text-anchor="middle">Infrastructure Layer (External Adapters)</text>

    <!-- PostgreSQL -->
    <rect x="70" y="520" width="100" height="35" rx="6" fill="#DC382D" opacity="0.9"/>
    <text x="120" y="535" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">PostgreSQL</text>
    <text x="120" y="548" font-family="Arial, sans-serif" font-size="9" fill="#ffcccc" text-anchor="middle">EF Core</text>

    <!-- BCrypt -->
    <rect x="190" y="520" width="90" height="35" rx="6" fill="#DC382D" opacity="0.9"/>
    <text x="235" y="535" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">BCrypt</text>
    <text x="235" y="548" font-family="Arial, sans-serif" font-size="9" fill="#ffcccc" text-anchor="middle">Hashing</text>

    <!-- JWT -->
    <rect x="300" y="520" width="90" height="35" rx="6" fill="#DC382D" opacity="0.9"/>
    <text x="345" y="535" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">JWT</text>
    <text x="345" y="548" font-family="Arial, sans-serif" font-size="9" fill="#ffcccc" text-anchor="middle">Tokens</text>

    <!-- File Storage -->
    <rect x="410" y="520" width="140" height="35" rx="6" fill="#DC382D" opacity="0.9"/>
    <text x="480" y="535" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">File Storage</text>
    <text x="480" y="548" font-family="Arial, sans-serif" font-size="9" fill="#ffcccc" text-anchor="middle">Profile Images</text>
  </g>

  <!-- Dependency Rule Arrow (pointing inward) -->
  <text x="650" y="350" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="start">Dependencies</text>
  <text x="650" y="365" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="start">point inward</text>
  <path d="M 640 330 L 640 410" stroke="#FFB84D" stroke-width="3" fill="none" marker-end="url(#arrowhead-thick)"/>

  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#888888"/>
    </marker>
    <marker id="arrowhead-thick" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FFB84D"/>
    </marker>
  </defs>
</svg>
